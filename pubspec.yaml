name: ctet_tet_prep
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.2+13

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  google_sign_in: ^7.2.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  firebase_messaging: ^16.0.0
  firebase_crashlytics: ^5.0.0
  firebase_analytics: ^12.0.0
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  pinput: ^6.0.2
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  url_launcher: ^6.3.1
  google_mobile_ads: ^9.0.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_svg: ^2.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Generates the real launcher icon (assets/icon/icon.png) for every
  # Android density + an adaptive-icon layer, replacing Flutter's default
  # icon. Run `dart run flutter_launcher_icons` after adding the two
  # source images to assets/icon/ (see that folder's setup note) and
  # whenever the icon artwork changes — this package only generates on
  # demand, it doesn't hook into every build.
  flutter_launcher_icons: ^0.14.3

  # Generates a proper native splash screen (Android <12 + iOS use a
  # themed launch drawable; Android 12+ uses the OS's own splash API,
  # configured separately below since it has tighter size constraints).
  # Without this, only Android 12+ shows the big logo automatically —
  # older Android versions just show a blank screen while the app loads.
  # Run `dart run flutter_native_splash:create` after adding/changing the
  # icon artwork.
  flutter_native_splash: ^2.4.6

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/icons/google_logo.svg
    - assets/icon/icon_foreground.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  # Bundled locally (not fetched at runtime via google_fonts) so the app
  # never depends on reaching fonts.gstatic.com on a student's first
  # launch — see core/theme/app_theme.dart for why Noto Sans specifically
  # (full Devanagari coverage for the app's Hindi/English content).
  # Noto Nastaliq Urdu is registered as a fallback (not the primary family)
  # so Urdu/Arabic-script glyphs — absent from Noto Sans — render in the
  # correct Nastaliq calligraphic style instead of silently falling back to
  # a generic system font, while Latin/Devanagari text is unaffected.
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-VariableFont.ttf
    - family: Noto Nastaliq Urdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-VariableFont.ttf

# Real launcher icon — see dev_dependencies note above. image_path is the
# full-bleed icon (navy background + white glyph) used as-is on iOS and as
# the fallback/legacy icon on older Android; adaptive_icon_foreground is
# the same glyph with a transparent background, layered by Android over
# adaptive_icon_background at runtime so it works with any launcher's
# icon mask (circle, squircle, rounded square, ...).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#16234B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

# Native splash screen — see dev_dependencies note above. Same navy brand
# color as the adaptive icon background, so the launch experience is one
# consistent navy-to-app transition on every Android version (and iOS).
# android_12 is configured separately because Android 12+'s own splash
# API constrains the icon to a smaller safe zone than pre-12's full-bleed
# launch drawable — same image, tool handles the sizing difference.
flutter_native_splash:
  color: "#16234B"
  image: assets/icon/icon.png
  android_12:
    color: "#16234B"
    image: assets/icon/icon.png
